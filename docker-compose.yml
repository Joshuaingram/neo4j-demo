services:
  neo4j:
    image: neo4j:5
    container_name: neo4j-statbytes
    ports:
      - "7474:7474"   # Neo4j Browser  -> http://localhost:7474
      - "7687:7687"   # Bolt (drivers)
    environment:
      NEO4J_AUTH: neo4j/statbytes2026
      NEO4J_PLUGINS: '["graph-data-science"]'   # auto-downloads + allow-lists GDS on first start
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 2G
    volumes:
      - ./data:/import                 # LOAD CSV FROM 'file:///substations.csv' reads from here
      - neo4j_data:/data               # persists the database between restarts

volumes:
  neo4j_data:
